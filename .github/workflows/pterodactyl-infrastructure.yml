name: Pterodactyl infrastructure bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture pre-install system information
        run: |
          mkdir -p artifacts
          {
            echo '=== Ubuntu release ==='; cat /etc/os-release
            echo '=== Architecture ==='; uname -a; dpkg --print-architecture
            echo '=== Disk ==='; df -h
            echo '=== Memory ==='; free -h
          } > artifacts/system-info.log 2>&1
          { grep -R . /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true; } > artifacts/apt-sources.log 2>&1
      - name: Install infrastructure dependencies
        run: |
          mkdir -p artifacts
          : > artifacts/install.log
          set -o pipefail
          { sudo apt-get update; sudo apt-get install --yes mariadb-server redis-server php8.3-cli php8.3-fpm php8.3-mysql php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip php8.3-gd composer nginx curl; if ! command -v docker >/dev/null 2>&1; then sudo apt-get install --yes docker.io; fi; } |& tee artifacts/install.log
      - name: Start and verify infrastructure services
        run: |
          set -euo pipefail
          sudo systemctl enable --now mariadb redis-server php8.3-fpm nginx
          sudo systemctl start docker || sudo service docker start
          {
            echo '=== MariaDB ==='
            sudo systemctl --no-pager --full status mariadb
            sudo mariadb --protocol=socket -e 'SELECT VERSION() AS version;'
            echo '=== Redis ==='
            sudo systemctl --no-pager --full status redis-server
            redis-cli ping
            echo '=== PHP ==='
            php --version
            php -m
            composer --version
            echo '=== Nginx ==='
            sudo nginx -t
            sudo systemctl --no-pager --full status nginx
            curl --fail --silent --show-error http://127.0.0.1/ >/dev/null
            echo '=== Docker ==='
            sudo systemctl --no-pager --full status docker
            sudo docker info
            sudo docker run --rm hello-world
          } |& tee infrastructure-bootstrap.log
      - name: Retain infrastructure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pterodactyl-infrastructure-${{ github.run_id }}
          path: |
            artifacts/install.log
            artifacts/apt-sources.log
            artifacts/system-info.log
            infrastructure-bootstrap.log
          if-no-files-found: error
