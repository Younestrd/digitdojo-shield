name: Linux firewall integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nftables:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Initialize firewall integration diagnostics
        run: touch firewall-integration.log
      - name: Install kernel firewall test tools
        run: sudo apt-get update && sudo apt-get install --yes nftables iproute2 libcap2-bin
      - name: Install and verify Docker Engine
        run: |
          set -o pipefail
          {
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get install --yes docker.io
            fi
            sudo systemctl start docker || sudo service docker start
            sudo docker info --format 'Docker Engine {{.ServerVersion}} on {{.OperatingSystem}}'
          } 2>&1 | tee -a firewall-integration.log
      - name: Verify network namespace and CAP_NET_ADMIN access
        run: |
          trap 'sudo ip netns delete shield-ci-capability-check >/dev/null 2>&1 || true' EXIT
          sudo capsh --print | grep -q cap_net_admin
          sudo ip netns add shield-ci-capability-check
          sudo ip netns exec shield-ci-capability-check nft list ruleset
      - name: Unit tests and static analysis
        run: |
          go test -count=1 ./...
          go vet ./...
      - name: Privileged nftables integration tests
        run: |
          set -o pipefail
          sudo env "PATH=$PATH" SHIELD_DOCKER_INTEGRATION=1 go test -tags=integration -count=20 -v ./internal/firewall 2>&1 | tee firewall-integration.log
      - name: Retain firewall integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firewall-integration-${{ github.run_id }}
          path: firewall-integration.log
          if-no-files-found: error
